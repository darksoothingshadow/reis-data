<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEFbot</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
        }
        #shadow-root {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <script src="https://api.citymind.tech/resources/js/80"></script>
    <script>
        (function () {
            var last = null;
            console.log('[pefbot] state detector loaded');

            function check() {
                var el = document.getElementById('shadow-root');
                if (!el) return;
                var sr = el.shadowRoot;
                if (!sr) {
                    console.log('[pefbot] no shadowRoot yet');
                    return;
                }
                var win = sr.querySelector('.chat-window');
                if (!win) {
                    console.log('[pefbot] no .chat-window found');
                    return;
                }
                var disp = getComputedStyle(win).display;
                var state = disp !== 'none' ? 'open' : 'closed';
                if (state !== last) {
                    last = state;
                    console.log('[pefbot] state changed:', state);
                    window.parent.postMessage({ type: 'PEFBOT_STATE', state: state }, '*');
                }
            }
            setInterval(check, 300);
        })();
    </script>
</body>
</html>
