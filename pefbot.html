<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEFbot</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
        }
        #shadow-root {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <script src="https://api.citymind.tech/resources/js/80"></script>
    <script>
        (function () {
            var CLOSED = 'closed';
            var OPEN = 'open';
            var lastState = null;

            function getShadow() {
                var el = document.getElementById('shadow-root');
                return el && el.shadowRoot ? el.shadowRoot : null;
            }

            function injectOverrideCSS(shadow) {
                if (shadow.querySelector('#reis-override')) return;
                var style = document.createElement('style');
                style.id = 'reis-override';
                style.textContent =
                    '.chat-button { position: fixed !important; bottom: 0 !important; right: 0 !important; }' +
                    '.chat-window { position: fixed !important; bottom: 0 !important; right: 0 !important; ' +
                    'width: 100% !important; min-width: 0 !important; max-width: 100% !important; ' +
                    'height: 100% !important; max-height: 100% !important; border-radius: 12px !important; }' +
                    '.chat-window.maximized { width: 100% !important; height: 100% !important; }' +
                    '.suggestion-container { bottom: 75px !important; right: 5px !important; }';
                shadow.appendChild(style);
            }

            function detectState(shadow) {
                var chatWindow = shadow.querySelector('.chat-window');
                if (!chatWindow) return CLOSED;
                var style = window.getComputedStyle(chatWindow);
                return style.display !== 'none' ? OPEN : CLOSED;
            }

            function broadcast(state) {
                if (state !== lastState) {
                    lastState = state;
                    window.parent.postMessage({ type: 'PEFBOT_STATE', state: state }, '*');
                }
            }

            function enforceTransparency() {
                var els = document.querySelectorAll('body > *');
                for (var i = 0; i < els.length; i++) {
                    if (els[i].tagName === 'SCRIPT') continue;
                    els[i].style.setProperty('background', 'transparent', 'important');
                }
            }

            function tick() {
                enforceTransparency();
                var shadow = getShadow();
                if (shadow) {
                    injectOverrideCSS(shadow);
                    broadcast(detectState(shadow));
                }
            }

            var observer = new MutationObserver(tick);
            observer.observe(document.body, { childList: true, subtree: true, attributes: true });
            setInterval(tick, 500);
        })();
    </script>
</body>
</html>
