<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEFbot</title>
    <style>
        html, body { margin: 0; padding: 0; background: transparent !important; overflow: hidden; }
    </style>
</head>
<body>
    <script src="https://api.citymind.tech/resources/js/80"></script>
    <script>
        (function () {
            var CLOSED = 'closed';
            var OPEN = 'open';
            var lastState = CLOSED;

            function detectState() {
                var chatContainer = document.querySelector('.chat-container');
                if (!chatContainer) return CLOSED;
                var rect = chatContainer.getBoundingClientRect();
                return (rect.width > 100 && rect.height > 100) ? OPEN : CLOSED;
            }

            function broadcast(state) {
                if (state !== lastState) {
                    lastState = state;
                    window.parent.postMessage({ type: 'PEFBOT_STATE', state: state }, '*');
                }
            }

            // Force transparency on widget wrapper elements that aren't the chat panel
            function enforceTransparency() {
                var els = document.querySelectorAll('body > *');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    if (el.tagName === 'SCRIPT') continue;
                    var bg = window.getComputedStyle(el).backgroundColor;
                    if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') {
                        el.style.setProperty('background', 'transparent', 'important');
                    }
                }
            }

            var observer = new MutationObserver(function () {
                enforceTransparency();
                broadcast(detectState());
            });
            observer.observe(document.body, { childList: true, subtree: true, attributes: true });

            setInterval(function () {
                enforceTransparency();
                broadcast(detectState());
            }, 500);
        })();
    </script>
</body>
</html>
