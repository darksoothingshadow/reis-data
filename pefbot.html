<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEFbot</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
        }
        #shadow-root {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <script src="https://api.citymind.tech/resources/js/80"></script>
    <script>
        (function () {
            var last = null;
            function check() {
                var el = document.getElementById('shadow-root');
                var sr = el && el.shadowRoot;
                if (!sr) return;
                var win = sr.querySelector('.chat-window');
                var state = win && getComputedStyle(win).display !== 'none' ? 'open' : 'closed';
                if (state !== last) {
                    last = state;
                    window.parent.postMessage({ type: 'PEFBOT_STATE', state: state }, '*');
                }
            }
            setInterval(check, 300);
        })();
    </script>
</body>
</html>
